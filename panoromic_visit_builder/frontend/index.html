<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>panoramic view creator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/konva@9/konva.min.js" , defer></script>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.css" />

    <script src="https://cdn.jsdelivr.net/npm/polybooljs@1.2.0/dist/polybool.min.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js",
        "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.module.js"
      }
    }
    </script>


</head>

<body>
    <div id="side-bar">
        <h2>Tools</h2>
        <li>
            <button id="rectangle-tool">Rectangle</button>
        </li>
        <li>
            <button id="Circle-tool">Circle</button>
        </li>
        <li>
            <button id="Group-tool">Group</button>
        </li>
        </li>
        <li>
            <button id="Finish">Finish</button>
        </li>
        <li>
            <button id="Node-tool">Add Node</button>
        </li>
        <li>
            <button id="Switch-panorama-tool">Switch Panorama</button>
        </li>
        </li>
        <li>
            <button id="Group-remove-tool" , style="color: red;">Group Remove</button>
        </li>
    </div>
    <div id='container'></div>
    <div id="side-bar2">
        <h2>Properties</h2>
        <div id="properties">
            <li>
                <button id="Change-color-tool">Change Color</button>
            </li>
            <li>
                <button id="Set-panorama-tool">Set Panorama</button>
            </li>
            <li>
                <button id="Remove-object-tool">Remove Object</button>
            </li>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
