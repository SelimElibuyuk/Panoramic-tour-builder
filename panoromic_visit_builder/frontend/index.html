<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>panoramic view creator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/konva@9/konva.min.js" , defer></script>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.css" />

    <script src="https://cdn.jsdelivr.net/npm/polybooljs@1.2.0/dist/polybool.min.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js",
        "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.module.js"
      }
    }
    </script>


</head>

<body>
    <div id="side-bar">
        <h2>Tools</h2>
        <li>
            <button id="rectangle-tool">
                <span class="button_top"> Rectangle </span>
            </button>
        </li>
        <li>
            <button id="Circle-tool">
                <span class="button_top"> Circle </span>
            </button>
        </li>
        <li>
            <button id="Finish">
                <span class="button_top"> Finish Room </span>
            </button>
        </li>
        <li>
            <button id="Node-tool">
                <span class="button_top"> Add Node </span>
            </button>
        </li>
        <li>
            <button id="Object-tool">
                <span class="button_top"> Add Object </span>
            </button>
        </li>
        <li>
            <button id="Switch-panorama-tool">
                <span class="button_top"> Switch Panorama </span>
            </button>
        </li>
        <li>
            <button id="Save-tool">
                <span class="button_top"> Save </span>
            </button>
        </li>
        <li> <button id="btn-load-tours">
                <span class="button_top">Kayıtlı Turlarım</span>
            </button>
        </li>




    </div>
    <div class='main-container'>

        <div id="konva-container"></div>

        <div id="container"></div>
    </div>


    <div id="side-bar2">
        <h2>Properties</h2>
        <div id="properties">
            <li>
                <button id="Change-color-tool">
                    <span class="button_top"> Change Color </span>
                </button>
            </li>
            <li>
                <button id="Set-panorama-tool">
                    <span class="button_top"> Set Panorama </span>
                </button>
            </li>
            <li>
                <button id="Remove-object-tool" , class="remove-item">
                    <span class="button_top"> Remove Object </span>
                </button>
            </li>
        </div>
    </div>
    <div id="object-side-bar">
        <h2>Properties</h2>
        <div id="properties">
            <li>
                <button id="Change-color-tool">
                    <span class="button_top"> Change Color </span>
                </button>
            </li>
            <li>
                <button id="Set-object-tool">
                    <span class="button_top"> Set Object </span>
                </button>
            </li>
            <li>
                <button id="Remove-object-tool" , class="remove-item">
                    <span class="button_top"> Remove Object </span>
                </button>
            </li>
        </div>
    </div>

    <div id="tours-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Kayıtlı Showroomlar</h2>
                <span id="close-tours-modal" class="close-btn">&times;</span>
            </div>
            <div id="tours-list-container">
                <!-- Turlar buraya JavaScript ile eklenecek -->
            </div>
        </div>
    </div>
    <div id="tour-preview-modal" class="modal-overlay">
        <div class="modal-content preview-modal-content">
            <div class="modal-header">
                <h2 id="preview-tour-name">Showroom Önizleme</h2>
                <span id="close-preview-modal" class="close-btn">&times;</span>
            </div>
            <div class="preview-body">
                <div class="preview-image-wrapper">
                    <img id="preview-tour-image" src="" alt="Showroom Preview" />
                </div>
                <p id="preview-tour-date" class="preview-date"></p>
            </div>
            <div class="preview-actions">
                <button id="preview-btn-load" class="btn-load-tour">Yükle</button>
                <button id="preview-btn-delete" class="btn-delete-tour">Sil</button>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
