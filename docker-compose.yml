services:
  backend:
    build:
      context: ./panoromic_visit_builder/backend
    container_name: panoramic-backend
    environment:
      DATA_DIR: /data
      # Eski sürümün dosyaları ilk açılışta bir kez içe aktarılır (salt okunur).
      LEGACY_ASSETS_DIR: /legacy
    volumes:
      - panoramic-data:/data
      - ./panoromic_visit_builder/frontend/assets:/legacy:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: panoromic_visit_builder/frontend/Dockerfile
    container_name: panoramic-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  panoramic-data:
